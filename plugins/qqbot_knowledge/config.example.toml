[plugin]
enabled = true
config_version = "0.2.0"

[shared]
endpoint = "http://127.0.0.1:8081/v1/knowledge/dsp/search"
timeout_seconds = 22.0
max_evidence_chars = 6000

[search]
max_results = 4
max_chars = 2600
max_files_per_domain = 80
max_file_bytes = 220000
max_query_chars = 2000
timeout_seconds = 3.0
refresh_seconds = 600
cache_ttl_seconds = 600
cache_max_entries = 128

[scope]
# Empty means no group whitelist. Group facts are never inferred from session_id text.
enabled_group_ids = []
session_ttl_seconds = 600
session_max_entries = 1024

[[sources.roots]]
domain = "shapez"
path = "D:/project/shapez/DecompiledSource/Game.Content"

[[sources.roots]]
domain = "shapez"
path = "D:/project/shapez/shapez-mods/src"

[[sources.roots]]
domain = "shapez"
path = "D:/project/shapez/shapezPathAnalyzer/shapezAnalyzer"

[[sources.roots]]
domain = "factorio"
path = "D:/project/factorio/MLJ_Factorio_Mods"
