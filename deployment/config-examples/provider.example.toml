# Copy this DeepSeek Responses profile into config/model_config.toml generated by MaiBot.
# Keep the existing embedding provider and its task mapping.
# Never commit the real api_key or a private provider URL.

[[api_providers]]
name = "DeepSeek"
client_type = "openai_responses"
base_url = "https://api.deepseek.com"
api_key = "<set-only-in-config/model_config.toml>"
max_retry = 1
timeout = 30
retry_interval = 1
auth_type = "bearer"
auth_header_name = "Authorization"
auth_header_prefix = "Bearer"
auth_query_name = "api_key"
model_list_endpoint = "/models"
tool_argument_parse_mode = "auto"
reasoning_parse_mode = "auto"
default_headers = {}
default_query = {}

[[models]]
name = "deepseek-flash"
model_identifier = "deepseek-flash"
api_provider = "DeepSeek"
price_in = 3
price_out = 9
cache = true
cache_price_in = 0.1
visual = true
force_stream_mode = false

# 后台任务保持非思考，避免推理占满规划、识图或记忆任务的输出预算。
[models.extra_params.reasoning]
effort = "none"

[[models.extra_params.tools]]
type = "web_search"

# Replyer 复用同一实际模型，但独立设置输出参数，便于与后台任务分别维护。
[[models]]
name = "deepseek-flash-reply"
model_identifier = "deepseek-flash"
api_provider = "DeepSeek"
price_in = 3
price_out = 9
cache = true
cache_price_in = 0.1
visual = true
force_stream_mode = false

[models.extra_params.reasoning]
# 原生 Responses 客户端将 extra_params.reasoning 传入请求体；none 避免思考占满 4096 共享预算。
effort = "none"

[[models.extra_params.tools]]
type = "web_search"

# 保持 Replyer 单次输出上限；通过该模型的 reasoning.effort=none 规避共享预算耗尽。
# 输出预算和重试由原生 Core 处理；其余任务沿用原预算和超时。
[model_task_config.replyer]
model_list = ["deepseek-flash-reply"]
max_tokens = 4096

[model_task_config.planner]
model_list = ["deepseek-flash"]

[model_task_config.memory]
model_list = ["deepseek-flash"]

[model_task_config.mid_memory]
model_list = ["deepseek-flash"]

[model_task_config.utils]
model_list = ["deepseek-flash"]

[model_task_config.learner]
model_list = ["deepseek-flash"]

[model_task_config.expression_use]
model_list = ["deepseek-flash"]

[model_task_config.emoji]
model_list = ["deepseek-flash"]

[model_task_config.vlm]
model_list = ["deepseek-flash"]
