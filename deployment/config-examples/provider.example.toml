# Copy this shape into the full config/model_config.toml generated by MaiBot.
# Never commit the real api_key or a private provider URL.

[[api_providers]]
name = "replace-with-local-provider-name"
client_type = "openai"
base_url = "https://api.example.invalid/v1"
api_key = "<set-only-in-config/model_config.toml>"
max_retry = 1
timeout = 30
retry_interval = 1
auth_type = "bearer"
auth_header_name = "Authorization"
auth_header_prefix = "Bearer"
auth_query_name = "api_key"
model_list_endpoint = "/models"
tool_argument_parse_mode = "auto"
reasoning_parse_mode = "auto"
default_headers = {}
default_query = {}
