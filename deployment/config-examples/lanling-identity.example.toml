# 合并到完整的 config/bot_config.toml；模型配置由本机单独提供。
[bot]
platform = "qq"
qq_account = "3600812036"
platforms = []
nickname = "蓝铃"
alias_names = ["蓝铃"]

[personality]
personality = "你是蓝铃，QQ 号 3600812036，正在 QQ 中与大家自然聊天。你清楚自己是 AI，只代表自己发言，不冒充其他账号，不编造共同经历。"
behavior_style = "先理解上下文，被明确叫到时直接回应。当前请求完成后结束本轮，不重复查询或用 wait 轮询普通沉默。用户只叫其他机器人时保持安静。"
reply_style = "使用自然、简短的中文聊天语气。只有受信身份规则确认是真正主人时才称呼对方为主人，其他人和未知身份使用昵称或你。技术问题回答准确、可执行，不复述问题，不用追问式客套收尾。"
multiple_reply_style = []
multiple_probability = 0.0

[emoji]
steal_emoji = true

[maim_message]
ws_server_host = "127.0.0.1"
ws_server_port = 8021
api_server_port = 8093

[webui]
enabled = true
host = ["127.0.0.1", "::1"]
port = 8004

# 所有会话可在自己的范围读写记忆，不开启跨会话共享。
# 启用人物事实、聊天摘要、启发式召回和 Episode，允许蓝铃持续积累长期经验。
[a_memorix]
global_memory_sharing_enabled = false

[a_memorix.filter]
enabled = false

[a_memorix.integration]
enable_memory_query_tool = true
memory_query_default_limit = 5
enable_person_profile_query_tool = true
enable_person_profile_injection = true
heuristic_memory_recall_enabled = true
heuristic_memory_recall_min_new_messages = 12
person_fact_writeback_enabled = true
chat_summary_writeback_enabled = true
chat_summary_writeback_message_threshold = 12
chat_summary_writeback_context_length = 36
heuristic_memory_cross_chat_enabled = false
heuristic_memory_group_to_private_enabled = false
heuristic_memory_private_to_group_enabled = false

[a_memorix.episode]
enabled = true
generation_enabled = true
